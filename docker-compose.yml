services:
  db:
    image: postgres:16-alpine
    container_name: neuralhire_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-postgres}
      POSTGRES_DB: ${POSTGRES_DB-ai_virtual_coach}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migration:
    build:
      context: ./backend
    command: sh -c "PYTHONPATH=/app alembic -c /app/alembic.ini upgrade head"
    env_file:
      - ./.env
    environment:
      # Force Compose-network hostname (NOT localhost)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER-postgres}:${POSTGRES_PASSWORD-postgres}@db:5432/${POSTGRES_DB-ai_virtual_coach}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    environment:
      # Force Compose-network hostname (NOT localhost)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER-postgres}:${POSTGRES_PASSWORD-postgres}@db:5432/${POSTGRES_DB-ai_virtual_coach}
      HF_HOME: /app/.hf_cache
      TRANSFORMERS_CACHE: /app/.hf_cache
      SENTENCE_TRANSFORMERS_HOME: /app/.hf_cache
      HF_HUB_READ_TIMEOUT: "60"
      HF_HUB_ETAG_TIMEOUT: "60"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/.chroma:/app/.chroma
      - ./backend/.hf_cache:/app/.hf_cache
    depends_on:
      migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file:
      - ./.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  frontend_node_modules:


[pytest]
addopts = -p no:langsmith -v --tb=short --strict-markers --cov=backend --cov-report=html --cov-report=term-missing --cov-fail-under=80
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    performance: Performance tests
    slow: Slow running tests
    auth: Authentication tests
    interview: Interview tests
    mock: Mock test tests
    vision: Vision analysis tests
    proctor: Proctoring tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
